<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="100%" height="auto" role="img" aria-labelledby="state-machine-title state-machine-desc">
  <title id="state-machine-title">算法执行状态机：生成 → 公平性 → 验证 → 评分</title>
  <desc id="state-machine-desc">生成算法 v3 与评分算法 v3 的执行状态机。主路径从基础构建进入候选循环，经过时空割搜索、公平性校验、食物摆放、精确验证后进入评分与存档，最后输出；公平性、精确验证和存档选优失败时回到候选搜索；全部候选失败时进入 RouteFirst 降级路径。</desc>
  <style>
    :root {
      color-scheme: light;
      --surface: #F7F7F8;
      --surface-muted: #EFEFF2;
      --text: #171717;
      --text-muted: #52525B;
      --border: rgba(23, 23, 23, 0.12);
      --brand: #0FDC78;
      --brand-soft: #E5FFF2;
      --brand-text: #004D26;
      --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    :root[data-widget-theme="dark"] {
      color-scheme: dark;
      --surface: #171717;
      --surface-muted: #262626;
      --text: #E5E5E5;
      --text-muted: #A1A1AA;
      --border: rgba(229, 229, 229, 0.12);
      --brand: #32F08C;
      --brand-soft: #004D26;
      --brand-text: #E5FFF2;
    }
    .state > rect {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .state-brand > rect {
      fill: var(--brand-soft);
      stroke: var(--brand);
      stroke-width: 1.5;
    }
    .state-terminal > rect {
      fill: var(--surface-muted);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .th {
      fill: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
    }
    .ts {
      fill: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
    }
    .state-brand > .th,
    .state-brand > .ts {
      fill: var(--brand-text);
    }
    .arr {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .retry {
      stroke: var(--text-muted);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 5 4;
      stroke-linecap: round;
    }
    .note,
    .label,
    .legend {
      fill: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
    }
    .start {
      fill: var(--text);
    }
  </style>
  <defs>
    <marker id="sm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <text class="note" x="40" y="48">缓存命中 → 直接返回</text>
  <circle class="start" cx="200" cy="44" r="6"/>
  <path class="arr" d="M200 50 V64" marker-end="url(#sm-arrow)"/>
  <text class="label" x="208" y="62">miss</text>

  <g class="state">
    <rect x="60" y="70" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="96">BUILD_BASE</text>
    <text class="ts" x="80" y="116">地形 / 障碍 / S-E 候选</text>
  </g>
  <path class="arr" d="M200 130 V154" marker-end="url(#sm-arrow)"/>

  <g class="state">
    <rect x="60" y="160" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="186">BUILD_R1</text>
    <text class="ts" x="80" y="206">时间展开表 + Latest / slack</text>
  </g>
  <path class="arr" d="M200 220 V244" marker-end="url(#sm-arrow)"/>

  <g class="state">
    <rect x="60" y="250" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="276">SEARCH_CUTS</text>
    <text class="ts" x="80" y="296">束搜索时空割 + 初始等级</text>
  </g>
  <path class="arr" d="M200 310 V334" marker-end="url(#sm-arrow)"/>

  <g class="state-brand">
    <rect x="60" y="340" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="366">FAIRNESS</text>
    <text class="ts" x="80" y="386">图扩散 + AUC / 模糊隶属</text>
  </g>
  <path class="arr" d="M200 400 V424" marker-end="url(#sm-arrow)"/>
  <text class="label" x="208" y="416">pass</text>

  <g class="state">
    <rect x="60" y="430" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="456">PLACE_FOODS</text>
    <text class="ts" x="80" y="476">L 前沿 + 陷阱格诱饵</text>
  </g>
  <path class="arr" d="M200 490 V514" marker-end="url(#sm-arrow)"/>

  <g class="state">
    <rect x="60" y="520" width="280" height="60" rx="8"/>
    <text class="th" x="80" y="546">EXACT_VERIFY</text>
    <text class="ts" x="80" y="566">R2 精确重放；FPT in L</text>
  </g>
  <path class="arr" d="M340 550 H394" marker-end="url(#sm-arrow)"/>
  <text class="label" x="348" y="542">pass</text>

  <g class="state-terminal">
    <rect x="400" y="160" width="280" height="60" rx="30"/>
    <text class="th" x="420" y="186">FAIL</text>
    <text class="ts" x="420" y="206">报错（终态）</text>
  </g>

  <g class="state">
    <rect x="400" y="250" width="280" height="60" rx="8"/>
    <text class="th" x="420" y="276">FALLBACK</text>
    <text class="ts" x="420" y="296">RouteFirst 基线</text>
  </g>

  <g class="state-terminal">
    <rect x="400" y="340" width="280" height="60" rx="30"/>
    <text class="th" x="420" y="366">EMIT</text>
    <text class="ts" x="420" y="386">JSON + 缓存（终态）</text>
  </g>

  <g class="state">
    <rect x="400" y="430" width="280" height="60" rx="8"/>
    <text class="th" x="420" y="456">ARCHIVE</text>
    <text class="ts" x="420" y="476">MAP-Elites / 选优</text>
  </g>

  <g class="state-brand">
    <rect x="400" y="520" width="280" height="60" rx="8"/>
    <text class="th" x="420" y="546">SCORE</text>
    <text class="ts" x="420" y="566">H + 交互项 + PCHIP 校准</text>
  </g>

  <path class="arr" d="M540 520 V496" marker-end="url(#sm-arrow)"/>
  <path class="arr" d="M540 430 V406" marker-end="url(#sm-arrow)"/>
  <text class="label" x="548" y="420">done</text>

  <path class="retry" d="M400 460 H370 V300 H346" marker-end="url(#sm-arrow)"/>
  <path class="retry" d="M60 370 H46 V280 H54" marker-end="url(#sm-arrow)"/>
  <path class="retry" d="M60 550 H46 V370"/>
  <circle class="start" cx="46" cy="370" r="3"/>

  <path class="arr" d="M340 100 H370 V260 H394" marker-end="url(#sm-arrow)"/>
  <text class="label" x="378" y="124">fail</text>
  <path class="arr" d="M340 280 H394" marker-end="url(#sm-arrow)"/>
  <text class="label" x="348" y="294">耗尽</text>

  <path class="arr" d="M540 310 V334" marker-end="url(#sm-arrow)"/>
  <text class="label" x="548" y="330">ok</text>
  <path class="arr" d="M540 250 V226" marker-end="url(#sm-arrow)"/>
  <text class="label" x="548" y="242">fail</text>

  <path class="arr" d="M40 620 H70"/>
  <text class="legend" x="78" y="624">主路径</text>
  <path class="retry" d="M150 620 H180"/>
  <text class="legend" x="188" y="624">重试 / 下一候选</text>
  <text class="legend" x="40" y="646">缓存命中在入口直接返回；全部候选失败才进入 FALLBACK。</text>
</svg>
